<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="11">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#64748b"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#f97316"/>
    </marker>
  </defs>

  <rect width="920" height="560" fill="#f8f9fa" rx="12"/>
  <text x="460" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">ST3215 Servo Tester — Screen Navigation</text>

  <!-- HOME -->
  <rect x="370" y="50" width="160" height="55" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="450" y="73" text-anchor="middle" fill="white" font-weight="bold">🏠 Home Menu</text>
  <text x="450" y="90" text-anchor="middle" fill="#bfdbfe" font-size="10">Turn=scroll · Short=select</text>

  <!-- SCAN BAUD SELECT -->
  <rect x="30" y="160" width="155" height="55" rx="6" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="108" y="182" text-anchor="middle" fill="white" font-weight="bold">Scan Baud Select</text>
  <text x="108" y="198" text-anchor="middle" fill="#ede9fe" font-size="9">8 rates + Scan All</text>
  <text x="108" y="210" text-anchor="middle" fill="#ede9fe" font-size="9">Long=back</text>

  <!-- SCAN (single baud) -->
  <rect x="30" y="280" width="155" height="45" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="108" y="300" text-anchor="middle" fill="white" font-weight="bold">Scanning…</text>
  <text x="108" y="315" text-anchor="middle" fill="#ede9fe" font-size="9">Progress bar · auto-returns</text>

  <!-- SCAN ALL BAUD -->
  <rect x="200" y="280" width="155" height="45" rx="6" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="278" y="300" text-anchor="middle" fill="white" font-weight="bold">Scan All Bauds</text>
  <text x="278" y="315" text-anchor="middle" fill="#ede9fe" font-size="9">2-tier progress · auto-returns</text>

  <!-- SELECT SERVO -->
  <rect x="200" y="160" width="155" height="55" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
  <text x="278" y="182" text-anchor="middle" fill="white" font-weight="bold">Select Servo</text>
  <text x="278" y="198" text-anchor="middle" fill="#e0f2fe" font-size="9">Scroll IDs on bus</text>
  <text x="278" y="210" text-anchor="middle" fill="#e0f2fe" font-size="9">Short=pick · Long=back</text>

  <!-- LIVE CONTROL -->
  <rect x="370" y="160" width="165" height="55" rx="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <text x="453" y="182" text-anchor="middle" fill="white" font-weight="bold">Live Control</text>
  <text x="453" y="198" text-anchor="middle" fill="#d1fae5" font-size="9">Torque · Position · Speed · Acc</text>
  <text x="453" y="210" text-anchor="middle" fill="#d1fae5" font-size="9">Short=edit · Long=back/cancel</text>

  <!-- SERVO INFO -->
  <rect x="555" y="160" width="155" height="55" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <text x="633" y="182" text-anchor="middle" fill="white" font-weight="bold">Servo Info</text>
  <text x="633" y="198" text-anchor="middle" fill="#fef3c7" font-size="9">Online · Pos · Volt · Temp</text>
  <text x="633" y="210" text-anchor="middle" fill="#fef3c7" font-size="9">Short/Long=back</text>

  <!-- CONFIG MENU -->
  <rect x="555" y="290" width="165" height="55" rx="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <text x="638" y="308" text-anchor="middle" fill="white" font-weight="bold">Configure</text>
  <text x="638" y="322" text-anchor="middle" fill="#fee2e2" font-size="9">ID·Min·Max·TrqLim·Offset</text>
  <text x="638" y="336" text-anchor="middle" fill="#fee2e2" font-size="9">Mode·Baud · Long=back</text>

  <!-- MODE WARN -->
  <rect x="740" y="290" width="155" height="55" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="818" y="308" text-anchor="middle" fill="white" font-weight="bold">⚠ Wheel Mode</text>
  <text x="818" y="322" text-anchor="middle" fill="#fecaca" font-size="9">Warning screen</text>
  <text x="818" y="336" text-anchor="middle" fill="#fecaca" font-size="9">No(default) / Yes</text>

  <!-- CONFIRM SAVE -->
  <rect x="555" y="400" width="165" height="55" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  <text x="638" y="419" text-anchor="middle" fill="white" font-weight="bold">Confirm Save?</text>
  <text x="638" y="433" text-anchor="middle" fill="#e2e8f0" font-size="9">Summary of all 7 params</text>
  <text x="638" y="447" text-anchor="middle" fill="#e2e8f0" font-size="9">No / Yes</text>

  <!-- SAVE RESULT -->
  <rect x="370" y="400" width="165" height="55" rx="6" fill="#475569" stroke="#334155" stroke-width="1.5"/>
  <text x="453" y="419" text-anchor="middle" fill="white" font-weight="bold">Save Result</text>
  <text x="453" y="433" text-anchor="middle" fill="#e2e8f0" font-size="9">OK / Failed + message</text>
  <text x="453" y="447" text-anchor="middle" fill="#e2e8f0" font-size="9">Short/Long=back to Home</text>

  <!-- ===== ARROWS ===== -->
  <!-- Home → ScanBaudSelect -->
  <line x1="370" y1="90" x2="108" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="128" font-size="9" fill="#475569">Scan Bus</text>

  <!-- Home → SelectServo -->
  <line x1="390" y1="105" x2="278" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="308" y="130" font-size="9" fill="#475569">Select Servo</text>

  <!-- Home → LiveControl -->
  <line x1="450" y1="105" x2="450" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="456" y="137" font-size="9" fill="#475569">Live Ctrl</text>

  <!-- Home → ServoInfo -->
  <line x1="490" y1="97" x2="600" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="550" y="122" font-size="9" fill="#475569">Info</text>

  <!-- Home → ConfigMenu -->
  <line x1="510" y1="100" x2="620" y2="290" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="190" font-size="9" fill="#475569">Configure</text>

  <!-- Home → ConfirmSave (via Save Changes) -->
  <line x1="480" y1="105" x2="590" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="500" y="265" font-size="9" fill="#475569">Save Changes</text>

  <!-- ScanBaudSelect → Scan -->
  <line x1="108" y1="215" x2="108" y2="280" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="114" y="253" font-size="9" fill="#6d28d9">Single</text>

  <!-- ScanBaudSelect → ScanAll -->
  <line x1="160" y1="215" x2="240" y2="280" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="178" y="255" font-size="9" fill="#6d28d9">Scan All</text>

  <!-- Scan → Home (auto) -->
  <line x1="80" y1="325" x2="370" y2="75" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- ScanAll → Home (auto) -->
  <line x1="250" y1="325" x2="370" y2="80" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- ConfigMenu → ModeWarn -->
  <line x1="720" y1="315" x2="740" y2="315" stroke="#f97316" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="724" y="308" font-size="9" fill="#c2410c">Mode=Wheel</text>

  <!-- ModeWarn → ConfigMenu (Yes or No) -->
  <line x1="740" y1="335" x2="720" y2="330" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrb)"/>

  <!-- ConfigMenu → ConfirmSave -->
  <line x1="638" y1="345" x2="638" y2="400" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="644" y="376" font-size="9" fill="#475569">via Home</text>

  <!-- ConfirmSave → SaveResult (Yes) -->
  <line x1="555" y1="428" x2="535" y2="428" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="536" y="422" font-size="9" fill="#475569">Yes</text>

  <!-- SaveResult → Home -->
  <line x1="453" y1="400" x2="453" y2="105" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="30" y="490" width="860" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="510" font-size="10" font-weight="bold" fill="#1e293b">Navigation:</text>
  <text x="50" y="530" font-size="10" fill="#475569">Turn knob = scroll/change value     Short press = select/confirm/toggle edit     Long press = cancel edit or go Back to Home</text>
  <text x="50" y="543" font-size="9" fill="#94a3b8">Dashed lines = automatic transitions (no button press needed)</text>
</svg>
