<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fa" rx="12"/>
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">ST3215 Servo Tester — Wiring Diagram</text>

  <!-- ========== PICO + GROVE SHIELD ========== -->
  <rect x="310" y="50" width="280" height="340" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="450" y="72" text-anchor="middle" font-weight="bold" fill="#1e40af">Raspberry Pi Pico</text>
  <text x="450" y="86" text-anchor="middle" font-size="10" fill="#1e40af">+ Seeed Grove Shield v1.0</text>

  <!-- Grove connectors on shield -->
  <!-- I2C0: GP4/GP5 -->
  <rect x="320" y="100" width="110" height="30" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="375" y="117" text-anchor="middle" font-size="11" fill="#1e3a8a">Grove I2C0</text>
  <text x="375" y="128" text-anchor="middle" font-size="9" fill="#1e3a8a">SDA=GP4 · SCL=GP5</text>

  <!-- I2C1: GP2/GP3 -->
  <rect x="320" y="145" width="110" height="30" rx="4" fill="#bfdbfe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="375" y="162" text-anchor="middle" font-size="11" fill="#1e3a8a">Grove I2C1</text>
  <text x="375" y="173" text-anchor="middle" font-size="9" fill="#1e3a8a">SDA=GP2 · SCL=GP3</text>

  <!-- UART0: GP0/GP1 -->
  <rect x="320" y="190" width="110" height="30" rx="4" fill="#bbf7d0" stroke="#22c55e" stroke-width="1.5"/>
  <text x="375" y="207" text-anchor="middle" font-size="11" fill="#14532d">Grove UART0</text>
  <text x="375" y="218" text-anchor="middle" font-size="9" fill="#14532d">TX=GP0 · RX=GP1</text>

  <!-- Power note -->
  <rect x="320" y="240" width="110" height="40" rx="4" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="375" y="256" text-anchor="middle" font-size="10" fill="#713f12">Power Switch</text>
  <text x="375" y="268" text-anchor="middle" font-size="9" fill="#713f12">Set to 3.3 V</text>
  <text x="375" y="279" text-anchor="middle" font-size="9" fill="#713f12">for I2C modules</text>

  <!-- USB note -->
  <rect x="320" y="298" width="110" height="28" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="375" y="313" text-anchor="middle" font-size="10" fill="#3730a3">Micro-USB</text>
  <text x="375" y="325" text-anchor="middle" font-size="9" fill="#3730a3">Power + Programming</text>

  <!-- Pico pins raw reference -->
  <rect x="450" y="100" width="120" height="170" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>
  <text x="510" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#075985">GP Pin Map</text>
  <text x="510" y="130" text-anchor="middle" font-size="9" fill="#0c4a6e">GP0  → UART0 TX</text>
  <text x="510" y="143" text-anchor="middle" font-size="9" fill="#0c4a6e">GP1  → UART0 RX</text>
  <text x="510" y="156" text-anchor="middle" font-size="9" fill="#0c4a6e">GP2  → I2C1 SDA</text>
  <text x="510" y="169" text-anchor="middle" font-size="9" fill="#0c4a6e">GP3  → I2C1 SCL</text>
  <text x="510" y="182" text-anchor="middle" font-size="9" fill="#0c4a6e">GP4  → I2C0 SDA</text>
  <text x="510" y="195" text-anchor="middle" font-size="9" fill="#0c4a6e">GP5  → I2C0 SCL</text>
  <text x="510" y="212" text-anchor="middle" font-size="9" fill="#b45309">VSYS/5V rail</text>
  <text x="510" y="225" text-anchor="middle" font-size="9" fill="#b45309">powers 3V3 reg</text>
  <text x="510" y="242" text-anchor="middle" font-size="9" fill="#6b7280">Serial1 = UART0</text>
  <text x="510" y="255" text-anchor="middle" font-size="9" fill="#6b7280">Wire  = I2C0</text>
  <text x="510" y="268" text-anchor="middle" font-size="9" fill="#6b7280">Wire1 = I2C1</text>

  <!-- ========== OLED ========== -->
  <rect x="30" y="60" width="200" height="110" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="130" y="80" text-anchor="middle" font-weight="bold" fill="#831843">M5Stack OLED Unit</text>
  <text x="130" y="95" text-anchor="middle" font-size="10" fill="#831843">1.3″ SH1107 · 128×64</text>
  <text x="130" y="110" text-anchor="middle" font-size="10" fill="#831843">I2C addr: 0x3C</text>
  <text x="130" y="125" text-anchor="middle" font-size="10" fill="#831843">Grove HY2.0-4P cable</text>
  <text x="130" y="143" text-anchor="middle" font-size="9" fill="#9f1239">→ Grove I2C0 (GP4/GP5)</text>

  <!-- OLED wire -->
  <line x1="230" y1="115" x2="320" y2="115" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- ========== ENCODER ========== -->
  <rect x="30" y="200" width="200" height="110" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="130" y="220" text-anchor="middle" font-weight="bold" fill="#064e3b">M5Stack Encoder Unit</text>
  <text x="130" y="236" text-anchor="middle" font-size="10" fill="#064e3b">STM32F030 · 30 pos/rev</text>
  <text x="130" y="251" text-anchor="middle" font-size="10" fill="#064e3b">2× SK6812 RGB LEDs</text>
  <text x="130" y="266" text-anchor="middle" font-size="10" fill="#064e3b">I2C addr: 0x40</text>
  <text x="130" y="281" text-anchor="middle" font-size="9" fill="#064e3b">Grove HY2.0-4P cable</text>
  <text x="130" y="299" text-anchor="middle" font-size="9" fill="#065f46">→ Grove I2C1 (GP2/GP3)</text>

  <!-- Encoder wire -->
  <line x1="230" y1="255" x2="320" y2="160" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- ========== WAVESHARE DRIVER BOARD ========== -->
  <rect x="620" y="60" width="250" height="200" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="745" y="82" text-anchor="middle" font-weight="bold" fill="#7c2d12">Waveshare Bus Servo</text>
  <text x="745" y="96" text-anchor="middle" font-size="10" fill="#7c2d12">Adapter (A) Driver Board</text>

  <rect x="635" y="108" width="220" height="25" rx="3" fill="#fed7aa" stroke="#fb923c"/>
  <text x="745" y="120" text-anchor="middle" font-size="10" fill="#7c2d12">⚠  Jumper must be on position A</text>
  <text x="745" y="130" text-anchor="middle" font-size="9" fill="#7c2d12">(UART mode, not USB mode)</text>

  <text x="635" y="153" font-size="10" fill="#431407">UART pins (3.3 V logic):</text>
  <text x="635" y="167" font-size="10" fill="#431407">  T  ← Pico GP0 (TX)</text>
  <text x="635" y="181" font-size="10" fill="#431407">  R  ← Pico GP1 (RX)</text>
  <text x="635" y="195" font-size="10" fill="#431407">  G  ← Pico GND (common)</text>
  <text x="635" y="213" font-size="10" fill="#b45309">Power Jack (DC5521):</text>
  <text x="635" y="227" font-size="10" fill="#b45309">  9–12.6 V DC · match servo Vcc</text>
  <text x="635" y="241" font-size="10" fill="#431407">Servo connector → ST3215 chain</text>

  <!-- Pico → Driver board wire (UART) -->
  <line x1="590" y1="205" x2="620" y2="180" stroke="#f97316" stroke-width="2.5" stroke-dasharray="7,3" marker-end="url(#arrow)"/>
  <text x="604" y="198" font-size="9" fill="#9a3412" text-anchor="middle">UART0</text>
  <text x="604" y="210" font-size="9" fill="#9a3412" text-anchor="middle">T·R·G</text>

  <!-- ========== ST3215 SERVO ========== -->
  <rect x="630" y="300" width="230" height="120" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="745" y="320" text-anchor="middle" font-weight="bold" fill="#0f172a">ST3215 Servo(s)</text>
  <text x="745" y="336" text-anchor="middle" font-size="10" fill="#334155">360° magnetic encoder</text>
  <text x="745" y="350" text-anchor="middle" font-size="10" fill="#334155">Default ID: 1 · Default baud: 1 Mbaud</text>
  <text x="745" y="365" text-anchor="middle" font-size="10" fill="#334155">Vcc: 4–7.4 V (std) / 9–12.6 V (HS)</text>
  <text x="745" y="380" text-anchor="middle" font-size="10" fill="#334155">Daisy-chain via twin servo ports</text>
  <text x="745" y="398" text-anchor="middle" font-size="9" fill="#64748b">Up to 253 servos on one bus</text>

  <!-- Driver board → Servo -->
  <line x1="745" y1="260" x2="745" y2="300" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="755" y="283" font-size="9" fill="#475569">Serial bus</text>

  <!-- ========== GROVE CABLE LEGEND ========== -->
  <rect x="30" y="440" width="420" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="240" y="460" text-anchor="middle" font-weight="bold" fill="#0f172a">Grove HY2.0-4P Connector Pinout</text>
  <text x="240" y="478" text-anchor="middle" font-size="10" fill="#475569">(applies to both OLED and Encoder cables)</text>

  <!-- Pin 1 -->
  <rect x="50" y="488" width="12" height="12" fill="#fbbf24"/>
  <text x="70" y="499" font-size="10" fill="#0f172a">Pin 1 — Yellow — SDA (data)</text>
  <!-- Pin 2 -->
  <rect x="50" y="508" width="12" height="12" fill="#ffffff" stroke="#64748b"/>
  <text x="70" y="519" font-size="10" fill="#0f172a">Pin 2 — White  — SCL (clock)</text>
  <!-- Pin 3 -->
  <rect x="50" y="528" width="12" height="12" fill="#dc2626"/>
  <text x="70" y="539" font-size="10" fill="#0f172a">Pin 3 — Red    — VCC (3.3 V, shield switch set to 3.3 V)</text>
  <!-- Pin 4 -->
  <rect x="50" y="548" width="12" height="12" fill="#1e293b"/>
  <text x="70" y="559" font-size="10" fill="#0f172a">Pin 4 — Black  — GND</text>

  <text x="50" y="580" font-size="9" fill="#6b7280">Note: Grove connector is keyed — it only fits one way.</text>

  <!-- ========== POWER NOTE ========== -->
  <rect x="480" y="440" width="390" height="150" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="675" y="460" text-anchor="middle" font-weight="bold" fill="#78350f">⚡  Power Notes</text>
  <text x="490" y="480" font-size="10" fill="#451a03">• Pico powered via USB (5 V) from PC or charger</text>
  <text x="490" y="496" font-size="10" fill="#451a03">• Grove shield switch → 3.3 V (for I2C modules)</text>
  <text x="490" y="512" font-size="10" fill="#451a03">• Servo driver board needs separate DC supply:</text>
  <text x="490" y="528" font-size="10" fill="#7c2d12">    ST3215 std: 4–7.4 V   ST3215-HS: 9–12.6 V</text>
  <text x="490" y="544" font-size="10" fill="#451a03">• GND of Pico and driver board MUST be shared</text>
  <text x="490" y="560" font-size="10" fill="#451a03">• UART is 3.3 V logic — no level shifter needed</text>
  <text x="490" y="576" font-size="10" fill="#b45309">• Do NOT power servos from Pico VSYS / 5V pin</text>
</svg>
